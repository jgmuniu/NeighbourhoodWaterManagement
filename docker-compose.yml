services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nwm_db}
      POSTGRES_USER: ${POSTGRES_USER:-nwm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nwm_postgres_data:/var/lib/postgresql/data
    ports:
      - "${NWM_DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nwm_user} -d ${POSTGRES_DB:-nwm_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NWM_API_SECRET: ${NWM_API_SECRET:?Set NWM_API_SECRET in .env}
      NWM_TOKEN_MINUTES: ${NWM_TOKEN_MINUTES:-720}
      NWM_CORS_ORIGINS: ${NWM_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      NWM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nwm_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-nwm_db}
    ports:
      - "${NWM_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  nwm_postgres_data:
